[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quick-task"
version = "0.1.0"
description = "Markdown-based task management CLI"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
qt = "quick_task.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quick_task"]
